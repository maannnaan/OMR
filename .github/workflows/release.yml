# Builds a signed release APK when a version tag is pushed (git tag v1.1.0 && git push origin v1.1.0)
# and attaches it to a GitHub Release as omr-scanner.apk, so
# https://github.com/maannnaan/OMR/releases/latest/download/omr-scanner.apk is always the newest.
#
# Signing needs four repository secrets (Settings > Secrets and variables > Actions):
# OMR_KEYSTORE_BASE64, OMR_KEYSTORE_PASSWORD, OMR_KEY_ALIAS, OMR_KEY_PASSWORD.
name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unpack the signing key
        env:
          OMR_KEYSTORE_BASE64: ${{ secrets.OMR_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$OMR_KEYSTORE_BASE64" ]; then
            echo "::error::The OMR_KEYSTORE_BASE64 secret is missing. See the comment at the top of this workflow."
            exit 1
          fi
          echo "$OMR_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/omr-release.jks"
          echo "OMR_KEYSTORE_FILE=$RUNNER_TEMP/omr-release.jks" >> "$GITHUB_ENV"

      - name: Test, then build the signed release APK
        env:
          OMR_KEYSTORE_PASSWORD: ${{ secrets.OMR_KEYSTORE_PASSWORD }}
          OMR_KEY_ALIAS: ${{ secrets.OMR_KEY_ALIAS }}
          OMR_KEY_PASSWORD: ${{ secrets.OMR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk omr-scanner.apk

      - name: Check the APK is signed with the release key
        run: |
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --print-certs omr-scanner.apk | grep -i "SHA-256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" omr-scanner.apk \
            --title "OMR Scanner $GITHUB_REF_NAME" \
            --notes "Install: open this page on the phone, download omr-scanner.apk and open it. Android asks once to allow installing from this source."
